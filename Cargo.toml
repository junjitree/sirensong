[package]
name = "starbypass"
version = "0.1.0"
edition = "2024"
description = "Automates connecting to Starbucks Wi-Fi captive portals"
license = "MIT"
repository = "https://github.com/junjitree/starbypass"
readme = "README.md"
keywords = ["starbucks", "wifi", "captive-portal", "automation"]
categories = ["command-line-utilities"]

[dependencies]
thirtyfour = "0.36.1"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
