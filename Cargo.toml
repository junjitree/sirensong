[package]
name = "sirensong"
version = "0.1.1"
edition = "2024"
description = "Automates Starbucks Wi-Fi captive-portal login with MAC rotation"
license = "MIT"
repository = "https://github.com/junjitree/sirensong"
readme = "README.md"
keywords = ["starbucks", "wifi", "captive-portal", "automation"]
categories = ["command-line-utilities"]

[dependencies]
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "cookies",
] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
